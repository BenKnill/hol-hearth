[project]
name = "hol-hearth"
version = "0.1.0"
description = "Warm HOL Light proof checks and readable receipts on Linux"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/BenKnill/hol-hearth"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
