[project]
name = "hol-hearth"
version = "0.2.0"
description = "Warm HOL Light proof checks and readable receipts on Linux"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/BenKnill/hol-hearth"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# These standalone entrypoints add the checkout to sys.path before importing it.
[tool.ruff.lint.per-file-ignores]
"dev/authoring-selftest.py" = ["E402"]
"dev/clone-satisfaction-selftest.py" = ["E402"]
"dev/elf-bootstrap-selftest.py" = ["E402"]
"dev/leaf-needs-selftest.py" = ["E402"]
"dev/progress-selftest.py" = ["E402"]
"dev/project-basis-replay-selftest.py" = ["E402"]
"dev/project-basis-selftest.py" = ["E402"]
"dev/proof-diagnostics-selftest.py" = ["E402"]
"dev/reopen-selftest.py" = ["E402"]
"dev/setup-selftest.py" = ["E402"]
"dev/setup.py" = ["E402"]
"dev/source-analysis-cache-selftest.py" = ["E402"]
